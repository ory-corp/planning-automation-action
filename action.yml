name: "Project Board Automation"
description: "Automate GitHub Projects with ease"

inputs:
  organization:
    description: GitHub organization
    required: false
  project:
    description: Project board number
    required: true
    default: "1"
  token:
    description: GitHub Token with org:write
    required: true
  todoLabel:
    description: Initial label for new issues/PRs
    required: false
    default: "needs triage"
  statusName:
    description: Name of the 'status' field on the project board
    required: false
    default: status
  prStatusValue:
    description: Name of the 'todo' status on the project board
    required: false
    default: todo
  issueStatusValue:
    description: Name of the 'todo' status on the project board
    required: false
    default: todo
  includeEffort:
    description: if true, set effort
    required: false
    default: 'true'
  effortName:
    description: Name of the 'effort' field on the project board
    required: false
    default: effort
  effortMapping:
    description: |
      JSON string with map where: 
        - string key is a valid 'effort' field value
        - number value is maximum duration in days
      for example: [{"pattern": "two days", "value": 2},{"pattern": "the longest one", "value": 1e1000}]
    required: false
    default: '[{"pattern": "two days", "value": 2},{"pattern": "the longest one", "value": 1e1000}]'
  monthlyMilestoneName:
    description: Name of the 'monthly milestone' field on the project board
    required: false
    default: monthly milestone
  quarterlyMilestoneName:
    description: Name of the 'quarterly milestone' field on the project board
    required: false
    default: quarterly milestone

runs:
  using: "composite"
  steps:
    - name: Initial labeling
      if: ${{ ! env.ACT_TEST }}
      uses: andymckay/labeler@e6c4322d0397f3240f0e7e30a33b5c5df2d39e90
      with:
        add-labels: "${{ inputs.todoLabel }}"
        ignore-if-assigned: true
        ignore-if-labeled: true
    - name: Fetch project data
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      if: ${{ github.actor != 'dependabot[bot]' }}
      id: runscript
      env:
        PLANNING_AUTOMATION_ACTION_PATH: ${{ github.action_path }}
        PLANNING_AUTOMATION_ORGANIZATION: ${{ inputs.organization }}
        PLANNING_AUTOMATION_PROJECT: ${{ inputs.project }}
        PLANNING_AUTOMATION_STATUS_NAME: ${{ inputs.statusName }}
        PLANNING_AUTOMATION_PR_STATUS_VALUE: ${{ inputs.prStatusValue }}
        PLANNING_AUTOMATION_ISSUE_STATUS_VALUE: ${{ inputs.issueStatusValue }}
        PLANNING_AUTOMATION_INCLUDE_EFFORT: ${{ inputs.includeEffort }}
        PLANNING_AUTOMATION_EFFORT_NAME: ${{ inputs.effortName }}
        PLANNING_AUTOMATION_EFFORT_MAPPING: ${{ inputs.effortMapping }}
        PLANNING_AUTOMATION_MONTHLY_MILESTONE_NAME: ${{ inputs.monthlyMilestoneName }}
        PLANNING_AUTOMATION_QUARTERLY_MILESTONE_NAME: ${{ inputs.quarterlyMilestoneName }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const script = require(`${process.env.PLANNING_AUTOMATION_ACTION_PATH}/action.js`)
          await script(
            github,
            context,
            core,
            process.env.PLANNING_AUTOMATION_ORGANIZATION,
            Number(process.env.PLANNING_AUTOMATION_PROJECT),
            process.env.PLANNING_AUTOMATION_STATUS_NAME,
            process.env.PLANNING_AUTOMATION_PR_STATUS_VALUE,
            process.env.PLANNING_AUTOMATION_ISSUE_STATUS_VALUE,
            process.env.PLANNING_AUTOMATION_INCLUDE_EFFORT === 'true',
            process.env.PLANNING_AUTOMATION_EFFORT_NAME,
            process.env.PLANNING_AUTOMATION_EFFORT_MAPPING,
            process.env.PLANNING_AUTOMATION_MONTHLY_MILESTONE_NAME,
            process.env.PLANNING_AUTOMATION_QUARTERLY_MILESTONE_NAME,
            process.env.PLANNING_AUTOMATION_ACTION_PATH
          )
